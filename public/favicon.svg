<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="PREI">
  <!--
    PREI Smart Suites — sekme ikonu.
    Tasarım kararları:
    · Marka moru #9B5BB3 (Design System accent). Şablondan kalan #863bff atıldı.
    · Gradyan/gölge/bulanıklık YOK — tasarım sistemi yasaklıyor ve 16px'te
      hepsi çamura dönüyor (eski ikon 9,5 KB'lık blur filtresi taşıyordu).
    · Tek harf monogram: 16×16'da okunan tek biçim bu.
    · Karşı boşluk (P'nin deliği) köşeli — yuvarlak yerine geometrik,
      "Private Banking Terminal" diline uygun.
    · Dolu mor zemin: açık ve koyu sekme temasının ikisinde de kontrast korunur.
  -->
  <rect width="32" height="32" rx="7" fill="#9B5BB3"/>
  <path fill="#FFFFFF" fill-rule="evenodd" clip-rule="evenodd"
        d="M9.4 6.4h9.3c3.7 0 6.6 2.9 6.6 6.6s-2.9 6.6-6.6 6.6h-4.7v6.0H9.4V6.4Z
           M14.0 10.5h4.7c1.4 0 2.5 1.1 2.5 2.5s-1.1 2.5-2.5 2.5h-4.7v-5.0Z"/>
